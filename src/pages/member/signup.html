<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="판다마켓" />
    <meta property="og:title" content="판다마켓" />
    <link rel="icon" href="../../../public/img/icon/favicon.ico" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <link rel="stylesheet" href="../../styles/reset.css" />
    <link rel="stylesheet" href="../../styles/component.css" />
    <link rel="stylesheet" href="../../styles/common.css" />
    <link rel="stylesheet" href="../../styles/style_member.css" />
    <title>signup | 판다마켓</title>
  </head>
  <body>
    <div class="member-inner">
      <h2>
        <a href="/"
          ><img src="../../../public/img/logo.svg" alt="판다마켓 로고"
        /></a>
      </h2>
      <form action="">
        <fieldset>
          <ul class="member-form">
            <li>
              <label for="email">이메일</label><input type="email" id="email" />
            </li>
            <li>
              <label for="name">닉네임</label><input type="text" id="name" />
            </li>
            <li>
              <label for="psword">비밀번호</label
              ><input type="password" id="psword" />
              <button class="btn_visibility">
                <img
                  src="../../../public/img/icon/btn_visibility.svg"
                  alt="비밀번호 보이기"
                />
              </button>
            </li>
            <li>
              <label for="psword-confirm">비밀번호 확인</label
              ><input type="password" id="psword-confirm" />
              <button class="btn_visibility">
                <img
                  src="../../../public/img/icon/btn_visibility.svg"
                  alt="비밀번호 보이기"
                />
              </button>
            </li>
          </ul>
          <button class="btn-member">로그인</button>
          <div class="sns-member">
            <p>간편 로그인하기</p>
            <ul>
              <li>
                <a href="https://www.google.com/">
                  <img
                    src="../../../public/img/icon/ic_google_login.svg"
                    alt="구글 간편 로그인하기"
                  />
                </a>
              </li>
              <li>
                <a href="https://www.kakaocorp.com/page/">
                  <img
                    src="../../../public/img/icon/ic_kakao_login.svg"
                    alt="카카오 간편 로그인 하기"
                  />
                </a>
              </li>
            </ul>
          </div>
          <p class="member-info">
            이미 회원이신가요?<a href="login.html">로그인</a>
          </p>
        </fieldset>
      </form>
    </div>
  </body>
</html>
