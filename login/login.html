<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <link rel="stylesheet" href="style.css" />
  <title>로그인</title>
</head>
<body>
  <main class="login-container">
    <h1 class="logo-title">
      <a href="../index.html">
        <img class="logo-image" src="../images/panda-market-logo.png" alt="판다마켓 로고" />
      </a>
    </h1>

    <form class="login-form">
      <label for="email" class="form-label">이메일</label>
      <input
        class="form-input"
        id="email"
        name="username"
        type="email"
        placeholder="codeit@email.com"
        required
        autocomplete="on"
      />

      <label for="password" class="form-label">비밀번호</label>
      <input
        class="form-input"
        id="password"
        name="password"
        type="password"
        required
        autocomplete="on"
      />
    </form>

    <button class="login-button">로그인</button>

    <section class="social-login-section">
      <div class="social-login-box">
        <h1 class="social-login-title">간편 로그인하기</h1>
        <div class="social-icons">
          <a href="https://www.google.com/">
            <img src="../images/google.png" alt="Google 로그인" />
          </a>
          <a href="https://www.kakaocorp.com/page/">
            <img src="../images/kakao.png" alt="Kakao 로그인" />
          </a>
        </div>
      </div>
    </section>

    <h1 class="signup-prompt">
      판다마켓이 처음이신가요?
      <a href="../signup/signup.html">회원가입</a>
    </h1>
  </main>
</body>
</html>
