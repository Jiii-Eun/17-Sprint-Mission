 <!DOCTYPE html>
 <html lang="ko">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>
  <link rel="stylesheet" href="style.css">
 </head>
 <body>
  <div class="login_box">
    <div class="login_head">
      <img class="img logo" src="/images/panda_logo(big).png" alt="판다얼굴">
      <a class="title" href="/">판다마켓</a>
    </div>
    <form>
      <label for="email">이메일</label>
      <input name="email" type="email">
      <label for="password">비밀번호</label>
      <div class="password_box">
        <input name="password" type="password">
        <img class="checking_eyes" src="/images/btn_eye(close).png" alt="비밀번호 표시">
      </div>
      <button type="submit">로그인</button>
      <div class="simple_login">
        <span>간편 로그인하기</span>
        <div class="link_icon">
          <a class="link_icon" href="https://www.google.com/" target="_blank">
            <img class="img_ic" src="/images/ic_google.png" alt="구글">
          </a>
          <a class="link_icon" href="https://www.kakaocorp.com/page/" target="_blank">
            <img class="img_ic" src="/images/ic_kakaotalk.png" alt="카카오톡">
          </a>
        </div>
      </div>
      <span class="signup_link">판다마켓이 처음이신가요? <a id="linkup" href="../signup/signup.html">회원가입</a></span>
    </form>
  </div>
 </body>
 </html>
