<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="style/style.css" />
    <link rel="stylesheet" href="style/reset.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
  </head>
  <body>
    <header>
      <a class="header-icon" href="/">
        <img src="images/Group 19.png" alt="판다마켓" />
      </a>
      <a class="header-login-link blue-btn" href="login.html">로그인</a>
    </header>
    <main>
      <section class="banner">
        <div class="banner-inner-box">
          <div class="banner-text-and-btn-container">
            <h1 class="banner-text">
              일상의 모든 물건을<br />
              거래해 보세요
            </h1>
            <a class="top-banner-items-link blue-btn" href="items.html"
              >구경하러 가기</a
            >
          </div>
          <img
            class="banner-img"
            src="images/Img_home_top.png"
            alt="Top banner image"
          />
        </div>
      </section>

      <section class="cards">
        <div class="card-container">
          <div class="card">
            <img class="card-img" src="images/Img_home_01.png" alt="Hot Item" />
            <div class="card-right-part">
              <h6 class="card-title-type">Hot Item</h6>
              <h1 class="card-title">
                인기 상품을<br />
                확인해 보세요
              </h1>
              <h3 class="card-text">
                가장 HOT한 중고거래 물품을<br />
                판다 마켓에서 확인해 보세요
              </h3>
            </div>
          </div>
        </div>
        <div class="card-container">
          <div class="card">
            <img class="card-img" src="images/Img_home_02.png" alt="Hot Item" />
            <div class="card-right-part">
              <h6 class="card-title-type">Search</h6>
              <h1 class="card-title">
                구매를 원하는<br />
                상품을 검색하세요
              </h1>
              <h3 class="card-text">
                구매하고 싶은 물품은 검색해서<br />
                쉽게 찾아보세요
              </h3>
            </div>
          </div>
        </div>

        <div class="card-container">
          <div class="card">
            <img class="card-img" src="images/Img_home_03.png" alt="Hot Item" />
            <div class="card-right-part">
              <h6 class="card-title-type">Register</h6>
              <h1 class="card-title">
                판매를 원하는<br />
                상품을 등록하세요
              </h1>
              <h3 class="card-text">
                어떤 물건이든 판매하고 싶은 상품을<br />
                쉽게 등록하세요
              </h3>
            </div>
          </div>
        </div>
      </section>

      <section class="banner">
        <div class="banner-inner-box">
          <div class="banner-text-and-btn-container">
            <h1 class="banner-text">
              믿을 수 있는<br />
              판다마켓 중고 거래
            </h1>
          </div>
          <img
            class="banner-img"
            src="images/Img_home_bottom.png"
            alt="Bottom banner image"
          />
        </div>
      </section>
    </main>
    <footer>
      <div class="footer-container">
        <span class="footer-text-color">&copy;codeit - 2024</span>
        <div class="privacy-and-faq">
          <a class="footer-text-color" href="privacy.html">Privacy Policy</a>
          <a class="footer-text-color" href="faq.html">FAQ</a>
        </div>
        <div class="sns">
          <a href="https://www.facebook.com/" target="_blank">
            <img src="images/ic_facebook.png" alt="Facebook" />
          </a>
          <a href="https://x.com/" target="_blank">
            <img src="images/ic_twitter.png" alt="Twitter" />
          </a>
          <a href="https://www.youtube.com/" target="_blank">
            <img src="images/ic_youtube.png" alt="Youtube" />
          </a>
          <a href="https://www.instagram.com/" target="_blank">
            <img src="images/ic_instagram.png" alt="Instagram" />
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
