<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓 로그인</title>
    <link rel="stylesheet" href="../common/reset.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="../common/tokens.css" />
  </head>
  <body>
    <main id="login-page">
      <section class="login-container">
        <img
          class="logo-img"
          src="../images/logo_large.png"
          alt="판다마켓 로고"
        />
        <div class="login-body">
          <form id="login-form" method="post">
            <div class="form-container">
              <label class="input-type-txt" for="email">이메일</label>
              <input
                id="email"
                class="input-box"
                type="email"
                name="email"
                placeholder="이메일 입력"
                required
              />
              <label class="input-type-txt" for="password">비밀번호</label>
              <div class="password-wrap">
                <input
                  id="password"
                  class="input-box"
                  type="password"
                  name="password"
                  placeholder="비밀번호 입력"
                  required
                />
                <button type="button" class="visibility-btn">
                  <img
                    class="visibility-img"
                    src="../images/btn_visibility_off.png
                  "
                    alt="비밀번호 보기"
                  />
                </button>
              </div>
              <input class="login-submit-btn" type="submit" value="로그인" />
            </div>
          </form>
          <div class="simple-container">
            <h5 class="simple-login-txt">간편 로그인하기</h5>
            <div class="sns">
              <a class="sns-link" href="https://www.google.com/">
                <img
                  class="sns-img"
                  src="../images/google_icon.png"
                  alt="구글 바로가기"
                />
              </a>
              <a class="sns-link" href="https://www.kakaocorp.com/page/">
                <img
                  class="sns-img"
                  src="../images/kakao_icon.png"
                  alt="카카오 바로가기"
                />
              </a>
            </div>
          </div>
          <h6 class="signup-desc">
            판다마켓이 처음이신가요?<a class="sign-up-link" href="./signup.html"
              >회원가입</a
            >
          </h6>
        </div>
      </section>
    </main>
  </body>
</html>
