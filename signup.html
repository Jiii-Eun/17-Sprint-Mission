<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓 회원가입</title>
    <link rel="stylesheet" href="/css/form.css" />
    <script src="/js/error_message.js"></script>
    <script src="/js/toggle_password.js"></script>
  </head>
  <body>
    <main class="register-container">
      <header class="logo">
        <a href="./index.html"
          ><img src="./img/logo.png" alt="판다마켓로고"
        /></a>
      </header>
      <form class="register-form" action="#" method="post">
        <div class="form-group">
          <label for="email">이메일</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="codeit@email.com"
            required
            autocomplete="email"
          />
        </div>
        <div class="error-message" id="email-error"></div>

        <div class="form-group">
          <label for="nickname">닉네임</label>
          <input
            type="text"
            id="nickname"
            name="nickname"
            placeholder="닉네임을 입력하세요"
            required
            autocomplete="nickname"
          />
        </div>
        <div class="error-message" id="nickname-error"></div>

        <div class="form-group">
          <label for="password">비밀번호</label>
          <div class="password-input">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              required
            />
            <button type="button" class="toggle-password">
              <img src="./img/visibility_off.svg" alt="비밀번호 보기" />
            </button>
          </div>
          <div class="error-message" id="password-error"></div>
        </div>

        <div class="form-group">
          <label for="password-check">비밀번호 확인</label>
          <div class="confirm-input">
            <input
              type="password"
              id="password-check"
              name="password-check"
              required
            />
            <button type="button" class="toggle-password">
              <img src="./img/visibility_on.svg" alt="비밀번호 보기" />
            </button>
          </div>
          <div class="error-message" id="password-check-error"></div>
        </div>

        <button type="submit" class="login-button signup-button">
          회원가입
        </button>
      </form>
      <section>
        <div class="ez-login-container">
          <span class="login-text">간편 로그인하기</span>
          <div class="social-icons">
            <a
              href="https://www.google.com/"
              class="google-icon"
              title="Google로 로그인"
              ><img src="./img/googleicon.png" alt=""
            /></a>
            <a
              href="https://www.kakaocorp.com/page/"
              class="kakao-icon"
              title="카카오톡으로 로그인"
              ><img src="./img/kakaoicon.png" alt=""
            /></a>
          </div>
        </div>
      </section>
      <footer class="help-text">
        <p>
          이미 회원이신가요?
          <a href="./login.html" role="button">로그인</a>
        </p>
      </footer>
    </main>
  </body>
</html>
