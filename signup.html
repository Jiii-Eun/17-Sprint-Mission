<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 페이지</title>
  <link rel="stylesheet" href="styles/reset.css">
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/common.css">
  <link rel="stylesheet" href="styles/login.css" >
</head>
<body>
  
  <div class="content">
    <div class="title">
      <img class="logo" src="images/pandaicon.png" alt="판다마켓로고">
      <a href="/"><h1>판다마켓</h1></a> 
    </div>
    <form>
      <div class="email">
        <h2>이메일</h2>
        <input class="email-input" name="email" type="email" placeholder="이메일을 입력해 주세요.">
      </div>
      <div class="nickname">
        <h2>닉네임</h2>
        <input class="nickname-input" name="name" type="text" placeholder="닉네임을 입력해 주세요.">
      </div>
      <div class="pwd">
        <h2>비밀번호</h2>
        <div class="pwd-content">
          <input class="pwd-input" name="password" type="password" placeholder="비밀번호를 입력해 주세요.">
          <img class="eye" src="images/btn_visibility_off.png">
        </div>
      </div>
      <div class="pwd">
        <h2>비밀번호 확인</h2>
        <div class="pwd-content">
          <input class="pwd-input" name="password" type="password" placeholder="비밀번호를 다시 한 번 입력해 주세요.">
          <img class="eye" src="images/btn_visibility_on.png">
        </div>
      </div>
      <button class="login-btn" type="submit">회원가입</button>
    </form>
    <div class="section">
      <div class="simple-login">
        <h3>간편 로그인 하기</h3>
      </div>
      <div class="sns">
        <a href="https://www.google.com/"><img src="images/google.png" alt="google"></a>
        <a href="https://www.kakaocorp.com/page/"><img src="images/kakao.png" alt="kakao"></a>
      </div>
    </div>
    <div class="sign-up-message">
      <div class="message">
        이미 회원이신가요? <a href="login.html">로그인</a>
      </div>
    </div>

  </div>
</body>
</html>
