<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>판다마켓 회원가입</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

</head>
<body>
  <div class="login-container">
    <a href="/">
      <img src="img/logo_3x.svg" alt="판다마켓 로고" class="logo" />
    </a>
    <form class="login-form">
      <div class="input-wrapper">
        <label for="email">이메일</label>
        <input type="email" id="email" placeholder="이메일을 입력해주세요" />
        <p class="error-message" id="email-error"></p>
      </div>
      <div class="input-wrapper">
      <label for="nickname">닉네임</label>
      <input type="text" id="nickname" placeholder="닉네임을 입력해주세요" />
      <p class="error-message" id="nickname-error"></p>
      </div>
      <div class="input-wrapper">
        <label for="password">비밀번호</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="비밀번호를 입력해주세요" />
          <button type="button" class="toggle-visibility">
            <img src="icon/ic_visibility_off.svg" alt="비밀번호 보기" class="eye-icon" />
          </button>
          <p class="error-message" id="password-error"></p>
        </div>
      </div>
      <div class="input-wrapper">
        <label for="password-confirm">비밀번호 확인</label>
        <div class="password-wrapper">
          <input type="password" id="password-confirm" placeholder="비밀번호 확인을 입력해주세요" />
          <button type="button" class="toggle-visibility">
            <img src="icon/ic_visibility_on.svg" alt="비밀번호 보기" class="eye-icon" />
          </button>
          <p class="error-message" id="password-confirm-error"></p>

        </div>
     </div>
      <button type="submit" class="login-button">회원가입</button>
    </form>

    <div class="social-login">
      <p>간편 로그인하기</p>
      <div class="icons">
      <a href="https://www.google.com/" class="social-icon">
        <img src="icon/ic_google.png" alt="구글 로그인" />
      </a>
      <a href="https://www.kakaocorp.com/page/" class="social-icon">
        <img src="icon/ic_kakao.png" alt="카카오 로그인" />
      </a>
      </div>
    </div>

    <p class="signup">판다마켓이 처음이신가요? <a href="/login.html">로그인</a></p>
  </div>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
