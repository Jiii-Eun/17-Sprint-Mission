<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓 - 로그인</title>
    <link rel="icon" href="images/logo/favicon.ico" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/login-signup.css" />
  </head>

  <body>
    <div id="signupPage" class="signup-page">
      <a href="/" class="signup-img">
        <img src="images/logo.png" alt="판다마켓" class="signup-logo" />
      </a>
      <div class="signup-content">
        <form action="/signup" method="POST" class="signup-form">
          <div class="form-group">
            <label for="userId">이메일</label>
            <input id="userId" type="email" name="email" />
          </div>
          <div class="form-group">
            <label for="nickname">닉네임</label>
            <input id="nickname" type="text" name="text" />
          </div>
          <div class="form-group">
            <label for="password">비밀번호</label>
            <div class="input-wrapper">
              <input id="password" type="password" name="password" />
              <img src="images/password-icon1.png" alt="보기 아이콘" />
            </div>
          </div>
          <div class="form-group">
            <label for="passwordCheck">비밀번호 확인</label>
            <div class="input-wrapper">
              <input id="passwordCheck" type="text" name="text" />
              <img src="images/password-icon2.png" alt="보기 아이콘" />
            </div>
          </div>
          <a href="login.html" class="signup-btn button">회원가입</a>
        </form>
        <div class="simple-login">
          간편 로그인하기
          <div class="signup-icon-group">
            <a href="https://www.google.com/"
              ><img src="images/google.png" alt="google-icon"
            /></a>
            <a href="https://www.kakaocorp.com/page/"
              ><img src="images/kakao.png" alt="kakao-icon"
            /></a>
          </div>
        </div>
        <div class="footer-login-up">
          이미 회원이신가요?<a href="login.html">로그인</a>
        </div>
      </div>
    </div>
  </body>
</html>
