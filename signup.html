<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <title>회원가입 - 판다마켓</title>
    <link rel="stylesheet" href="/assets/styles/global.css">
    <link rel="stylesheet" href="/assets/styles/reset.css">
    <link rel="stylesheet" href="/assets/styles/login_signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  </head>
  <body>
    <div class="signup-form">
      <header class="title">
        <a href="/">
          <img src="public/images/home_logo.svg" class="title-img" alt="타이틀 이미지">
        </a>
    </header>
    <main>
      <form class="auth-form">
        <label for="email">이메일</label>
        <input type="text" id="email" class="auth-input">

        <label for="nickname">닉네임</label>
        <input type="text" id="nickname" class="auth-input">
        
        <label for="password">비밀번호</label>
        <div class="password-wrapper">
          <input type="password" id="password" class="auth-input">
          <i class="fa-solid fa-eye eye-icon"></i>
        </div>

        <label for="password-check">비밀번호 확인</label>
        <div class="password-check-wrapper">
          <input type="password" id="password-check" class="auth-input">
          <i class="fa-solid fa-eye eye-icon"></i>
        </div>

        <button type="submit" class="signup-submit">회원가입</button>

        <div class="simple-login-container">
          <p class="simple-login-desc">간편 로그인하기</p>
          <a href="https://www.google.com/">
            <img src="public/images/google_icon.png" class="simple_login_img" alt="간편 로그인 이미지">
          </a>
          <a href="https://www.kakaocorp.com/page/">
            <img src="public/images/kakao_icon.png" class="simple_login_img" alt="간편 로그인 이미지">
          </a>
        </div>
    </form>
    </main>
    <footer>
      <div class="signup-container">
        <p class="signup-desc">이미 회원이신가요?</p>
        <a href="/signup.html" class="login-button">로그인</a>
      </div>
    </footer>
    </div>
  </body>
