<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓</title>
    <link rel="icon" href="images/logo/favicon.ico" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>


<body class="body_background">
  <main class="container">

    <div class="login_icon">
      <a href="/" alt="로고"></a>  
    </div>
	   
    
    <div class="login_box">
      <!-- 회원가입 폼 -->
      <form class="login_container">
        <div class="login_box_email">
          <label for="login-email">이메일</label>
          <input id="login-email" name="email" type="email" placeholder="codeit@email.com"> 
        </div>

        <div class="login-username">
          <label for="login-username">닉네임</label>
          <input id="login-username" name="username" type="text" placeholder="판다"> 
        </div>
        
        <div>
          <label for="login-password">비밀번호</label>
          <input id="login-password" name="password" type="password" placeholder="●●●●●●●●">
        </div>

        <div>
          <label for="login-password-check">비밀번호</label>
          <input id="login-password-check" name="password-check" type="password" placeholder="asdffff">
        </div>

        <button class="login_button_login-html" type="submit">회원가입</button>

      </form>

      <!-- 간편로그인 구글, 네이버 -->
      <div class="social_login">
        <p>간편 로그인하기</p>
        <div>
          <a href="https://www.google.com" target="_blank"><img src="images/social/google-logo.svg" alt="google"></a>
          <a href="https://www.kakaocorp.com/page/" target="_blank"><img src="images/social/kakao-logo.svg" alt="Kakao"></a>
        </div>  
        </div>

      <!-- 회원가입 이동 -->
      <div class="signup_in">
        <p>이미 회원이신가요?</p> <a href="login.html">로그인</a>
      </div>


      </div>


  </main>


      <footer class="foot">
        <div class="foot_text">
            <p>©codeit - 2024</p>
        </div>
        <div class="foot_fbar">
            <a href="privacy.html">Privacy Policy</a>
            <a href="faq.html">FAQ</a>
        </div>
        <div class="foot_icon">
            <a href="https://www.facebook.com/" target="_blank"><img src="images/social/facebook-logo.svg"></a>
            <a href="https://x.com/" target="_blank"><img src="images/social/twitter-logo.svg"></a>
            <a href="https://www.youtube.com/" target="_blank"><img src="images/social/youtube-logo.svg"></a>
            <a href="https://www.instagram.com/" target="_blank"><img src="images/social/instagram-logo.svg"></a>
        </div>    
    </footer>



</body>


</html>
