<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="판다마켓" />
    <meta property="og:title" content="판다마켓" />
    <link rel="icon" href="img/icon/favicon.ico" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <link rel="stylesheet" href="style/reset.css" />
    <link rel="stylesheet" href="style/component.css" />
    <link rel="stylesheet" href="style/common.css" />
    <title>판다마켓</title>
  </head>
  <body>
    <header>
      <div class="inner">
        <h1 class="logo">
          <a href="/"><img src="img/logo.svg" alt="판다마켓 로고" /></a>
        </h1>
        <a href="/login" class="btn-login">로그인</a>
      </div>
    </header>
    <main>
      <section class="main-visual-section">
        <div class="inner">
          <h2 class="text-4xl">일상의 모든 물건을<br />거래해 보세요</h2>
          <a href="/items" class="btn-large">구경하러 가기</a>
        </div>
      </section>
      <section class="main-section">
        <div class="inner">
          <img src="img/Img_home_01.svg" alt="인기 상품을 확인해 보세요" />
          <div class="content">
            <h4 class="text-2lg">Hot item</h4>
            <h3 class="text-4xl">인기 상품을<br />확인해 보세요</h3>
            <p class="text-2xl">
              가장 HOT한 중고거래 물품을<br />
              판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
      </section>
      <section class="main-section">
        <div class="inner">
          <div class="content">
            <h4 class="text-2lg">Search</h4>
            <h3 class="text-4xl">구매를 원하는<br />상품을 검색하세요</h3>
            <p class="text-2xl">
              구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요
            </p>
          </div>
          <img
            src="img/Img_home_02.svg"
            alt="구매를 원하는 상품을 검색하세요"
          />
        </div>
      </section>
      <section class="main-section">
        <div class="inner">
          <img
            src="img/Img_home_03.svg"
            alt="판매를 원하는 상품을 등록하세요"
          />
          <div class="content">
            <h4 class="text-2lg">Register</h4>
            <h3 class="text-4xl">판매를 원하는 <br />상품을 등록하세요</h3>
            <p class="text-2xl">
              어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>
      <section class="main-bottom-section">
        <div class="inner">
          <h3 class="text-4xl">믿을 수 있는<br />판다마켓 중고 거래</h3>
        </div>
      </section>
    </main>
    <footer>
      <div class="inner">
        <span>©codeit - 2024</span>
        <ul class="customer">
          <li><a href="/privacy">Privacy Policy</a></li>
          <li><a href="/faq">FAQ</a></li>
        </ul>
        <ul class="social">
          <li>
            <a href="https://www.facebook.com/" target="_blank"
              ><img src="img/icon/ic_facebook.svg" alt="페이스북 바로가기"
            /></a>
          </li>
          <li>
            <a href="https://x.com/" target="_blank"
              ><img src="img/icon/ic_twitter.svg" alt="트위터 바로가기"
            /></a>
          </li>
          <li>
            <a href="https://www.youtube.com/" target="_blank"
              ><img src="img/icon/ic_youtube.svg" alt="유튜브 바로가기"
            /></a>
          </li>
          <li>
            <a href="https://www.instagram.com/" target="_blank"
              ><img src="img/icon/ic_instagram.svg" alt="인스타 바로가기"
            /></a>
          </li>
        </ul>
      </div>
    </footer>
  </body>
</html>
