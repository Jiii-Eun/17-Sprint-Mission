<!DOCTYPE html>
<html>
    <head>
        <title>판다마켓</title>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="images/favicon.png" />
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
    </head>
    <body>
        <header>
            <div class="header">
                <a href="/">
                    <img id="logo" src="image/pandamarket_logo.png" alt="판다마켓 로고">
                </a>
                <!--로그인 버튼-->
                <div class="header_login_button">
                    <a class="btn_login" href="/login.html">로그인</a>
                </div>
            </div>
        </header>
        
        <main>
            <!--메인 상단배너-->
            <div class="top_banner">
                <a href="/items">
                    <img id="top_banner_img" src="image/top_banner.png" alt="상단배너">
                </a>
            </div>
            <!--메인 카드영역-->
            <div class="section_1">
                <div class="container_1">
                    <img class="cover_1" src="image/Img_home_01.png" alt="인기상품">
                    <div class="details_1">
                        <div class="badge_1">Hot item</div>
                        <div class="content_title_1">
                            인기 상품을<br>
                            확인해 보세요</div>
                        <div class="description_1">
                            가장 HOT한 중고거래 물품을<br>
                            판다 마켓에서 확인해 보세요
                        </div>
                    </div>
                </div>
            </div>
            <div class="section_2">
                <div class="container_2">
                    <img class="cover_2" src="image/Img_home_02.png" alt="상품검색">
                    <div class="details_2">
                        <div class="badge_2">Search</div>
                        <div class="content_title_2">
                            구매를 원하는<br>
                            상품을 검색하세요</div>
                        <div class="description_2">
                            구매하고 싶은 물품은 검색해서<br>
                            쉽게 찾아보세요
                        </div>
                    </div>
                </div>
            </div>
            <div class="section_3">
                <div class="container_3">
                    <img class="cover_3" src="image/Img_home_03.png" alt="상품등록">
                    <div class="details_3">
                        <div class="badge_3">Register</div>
                        <div class="content_title_3">
                            판매를 원하는<br>
                            상품을 등록하세요</div>
                        <div class="description_3">
                            어떤 물건이든 판매하고 싶은<br>
                            상품을 쉽게 등록하세요
                        </div>
                    </div>
                </div>
            </div>
            <!--메인 하단배너-->
            <img id="bottom_banner_img" src="image/bottom_banner.png" alt="판다마켓 배너">
        </main>
        <footer>
            <div class="footer_section">
                <!--푸터> 저작권-->
                <span class="copyright">©codeit - 2024</span>
                <!--푸터> 개인정보 처리방침-->
                <div class="privacy">
                    <a href="/privacy.html">Privacy Policy</a>
                    <a href="/faq.html">FAQ</a>
                </div>
                <!--푸터> SNS 바로가기-->
                <div class="sns">            
                    <a href="https://www.facebook.com/">
                        <img src="image/ic_facebook.png" alt="페이스북_버튼">
                    </a>
                    <a href="https://x.com/">
                        <img src="image/ic_twitter.png" alt="x_버튼">
                    </a>
                    <a href="https://www.youtube.com/">
                        <img src="image/ic_youtube.png" alt="유튜브_버튼">
                    </a>
                    <a href="https://www.instagram.com/">
                        <img src="image/ic_instagram.png" alt="유튜브_버튼">
                    </a>
                </div>
            </div>
        </footer>
    </body>
</html>
