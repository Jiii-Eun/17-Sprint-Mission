<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓 로그인</title>
    <link rel="stylesheet" href="login_signup.css" />
  </head>
  <body>
    <main class="login-container">
      <header class="logo">
        <a href="./index.html"><img src="./img/logo.png" alt="" /></a>
      </header>
      <form class="login-form" action="#" method="post">
        <div class="form-group">
          <label for="email">이메일</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="codeit@email.com"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="password">비밀번호</label>
          <div class="password-input">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              required
            />
            <button type="button" class="toggle-password">
              <img
                src="./img/btn_visibility_off_24px.svg"
                alt="비밀번호 보기"
              />
            </button>
          </div>
        </div>
        <button type="submit" class="login-button">로그인</button>
      </form>
      <section>
        <div class="ez-login-container">
          <span class="login-text">간편 로그인하기</span>
          <div class="social-icons">
            <a
              href="https://www.google.com/"
              class="google-icon"
              title="Google로 로그인"
              ><img src="./img/googleicon.png" alt=""
            /></a>
            <a
              href="https://www.kakaocorp.com/page/"
              class="kakao-icon"
              title="카카오톡으로 로그인"
              ><img src="./img/kakaoicon.png" alt=""
            /></a>
          </div>
        </div>
      </section>
      <footer class="help-text">
        <p>
          판다마켓이 처음이신가요?
          <a href="./signup.html" role="button">회원가입</a>
        </p>
      </footer>
    </main>
  </body>
</html>
