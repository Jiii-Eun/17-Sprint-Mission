<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="styles/reset.css">
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/common.css">
  <link rel="stylesheet" href="styles/login.css" >
</head>
<body>
  <div class="content">
    <div class="title">
      <img class="logo" src="images/pandaicon.png" alt="판다마켓로고">
      <a href="/"><h1>판다마켓</h1></a> 
    </div>
    <form>
      <div class="email">
        <h2>이메일</h2>
        <input class="email-input" name="email" type="email">
      </div>
      <div class="pwd">
        <h2>비밀번호</h2>
        <div class="pwd-content">
          <input class="pwd-input" name="password" type="password" >
          <img class="eye" src="images/btn_visibility.png">
        </div>
      </div>
      <button class="login-btn" type="submit">로그인</button>
    </form>
    <div class="section">
      <div class="simple-login">
        <h3>간편 로그인 하기</h3>
      </div>
      <div class="sns">
        <a href="https://www.google.com/"><img src="images/google.png" alt="google"></a>
        <a href="https://www.kakaocorp.com/page/"><img src="images/kakao.png" alt="kakao"></a>
      </div>
    </div>
    <div class="sign-up-message">
      <div class="message">
        판다 마켓이 처음이신가요? <a href="/signup.html">회원가입</a>
      </div>
    </div>

  </div>
</body>
</html>
