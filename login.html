<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>판다마켓</title>
        <link rel="stylesheet" href="./css/reset.css">
        <link rel="stylesheet" href="./css/font.css">
        <link rel="stylesheet" href="./css/login.css">
    </head>
    <body>
        <div id="wrapper">
            <div class="logo">
                <img src="./image/panda_logo3x.png" alt="판다마켓 로고">
            </div>
            <form class="login_formbox">
                <label for="email">
                    이메일
                    <input id="email" name="email" type="email" placeholder="codeit@email.com">
                </label>
                <div class="password_box">
                    <label for="password">
                        비밀번호
                        <input id="password" name="password" type="password" placeholder="●●●●●●●●">
                    </label>
                    <div class="password_btn">
                        <img src="./image/password_on.png" alt="비밀번호 보기">
                        <img src="./image/password_off.png" alt="비밀번호 가리기">
                    </div>
                </div>
                <button class="login_btn">로그인</button>
            </form>
            <div class="simple_login">
                <p>간편 로그인하기</p>
                <div class="login_sns">
                    <a href="https://www.google.com/" class="login_google">
                        <img src="./image/google_icon.png" alt="구글 로그인 버튼" class="login_google_ic">
                    </a>
                    <a href="https://www.kakaocorp.com/page/" class="login_kakao">
                        <img src="./image/kakao_icon.png" alt="카카오 로그인 버튼" class="login_kakao_ic">
                    </a>
                </div>
            </div>
            <div class="sign_up">
                <p>판다마켓이 처음이신가요?</p>
                <a href="/signup">회원가입</a>
            </div>
        </div>
    </body>
</html>
