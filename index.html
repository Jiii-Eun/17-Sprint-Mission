<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓</title>
    <link rel="icon" href="images/logo/favicon.ico" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <link rel="stylesheet" href="style.css" />


</head>


<body>
    <header>
        <!--로고-->
        <div class="header">
            <a href="/">
                <img src="images/logo/panda-market-logo.png" alt="판다마켓 홈">
            </a>
            <a href="login.html" class="login_button">로그인</a>
        </div>
    </header>



    <main>
        <!--상단 배너-->
        <section class="banner_top">
            <div>
                <p class="banner_title">
                    일상의 모든 물건을<br>
                    거래해 보세요
                </p>
                <a href="items.html" class="banner_button">구경하러 가기</a>
            </div>

        </section>

        <!--첫번째 박스-->
        <article class="home_container">
            <img src="images/home/Img_home_01.png" alt="인기 상품">
            <div>
                <span class="home_preface">Hot item</span>
                <h1 class="home_head">
                    인기 상품을<br>
                    확인해 보세요
                </h1>
                <p class="home_explanation">
                    가장 HOT한 중고거래 물품을<br>
                    판다마켓에서 확인해 보세요
                </p>
            </div>    
        </article>

        <!--두번째 박스-->
        <article class="home_container">
            <div id="right">
                <span class="home_preface">Search</span>
                <h1 class="home_head">
                    구매를 원하는<br>
                    상품을 검색하세요
                </h1>
                <p class="home_explanation">
                    구매하고 싶은 물품은 검색해서<br>
                    쉽게 찾아보세요
                </p>
            </div>    
            <img src="images/home/Img_home_02.png" alt="상품 검색">
        </article>

        <!--세번째 박스-->
        <article  class="home_container">
            <img src="images/home/Img_home_03.png" alt="판매 등록">
            <div>
                <span class="home_preface">Register</span>
                <h1 class="home_head">
                    판매를 원하는<br>
                    상품을 등록하세요
                </h1>
                <p class="home_explanation">
                    어떤 물건이든 판매하고 싶은 상품을<br>
                    쉽게 등록하세요
                </p>
            </div>    
        </article>

        <!--하단 배너-->
        <section class="banner_bottom">
            <div>
                <p class="banner_title">
                    믿을 수 있는<br>
                    판다마켓 중고거래
                </p>
            </div>
        </section>
    </main>

    <footer class="foot">
        <div class="foot_text">
            <p>©codeit - 2024</p>
        </div>
        <div class="foot_fbar">
            <a href="privacy.html">Privacy Policy</a>
            <a href="faq.html">FAQ</a>
        </div>
        <div class="foot_icon">
            <a href="https://www.facebook.com/" target="_blank"><img src="images/social/facebook-logo.svg" alt="페이스북"></a>
            <a href="https://x.com/" target="_blank"><img src="images/social/twitter-logo.svg" alt="트위터"></a>
            <a href="https://www.youtube.com/" target="_blank"><img src="images/social/youtube-logo.svg" alt="유튜브"></a>
            <a href="https://www.instagram.com/" target="_blank"><img src="images/social/instagram-logo.svg" alt="인스타그램"></a>
        </div>    
    </footer>
</body>
</html>
