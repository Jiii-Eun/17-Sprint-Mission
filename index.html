<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>판다마켓</title>
        <link rel="stylesheet" href="home.css">
    </head>
    <body>
        <div id="wrapper">
            <nav class="nav">
                <div class="gnb">
                    <a href="/" class="logo_btn">
                        <img src="./image/panda_logo.png" alt="판다마켓 로고">
                    </a>
                    <a href="/login" class="login_btn">로그인</a>
                </div>
            </nav>
            <header class="header">
                <div class="header_container">
                    <div class="header_textbox">
                        <h1 class="header_txt">일상의 모든 물건을 <br>거래해 보세요</h1>
                        <a href="/items" class="header_btn">구경하러 가기</a>
                    </div>
                    <div class="header_imgbox">
                        <img src="./image/header_img.png" alt="메인 이미지">
                    </div>              
                </div>
            </header>
            <section class="contents_container">
                <div class="contents_box">
                    <div class="contents_card card1">
                        <div class="card_imgbox">
                            <img src="./image/card_img1.png" alt="인기 상품 확인" class="card_img">
                        </div>
                        <div class="card_textbox">
                            <span>Hot item</span>
                            <h2>인기 상품을<br>확인해 보세요</h2>
                            <p>가장 HOT한 중고거래 물품을<br>판다 마켓에서 확인해 보세요</p>
                        </div>
                    </div>
                </div>
                <div class="contents_box">
                    <div class="contents_card card2">
                        <div class="card_textbox text_box2">
                            <span>Search</span>
                            <h2>구매를 원하는<br>상품을 검색하세요</h2>
                            <p>구매하고 싶은 물품은 검색해서<br>쉽게 찾아보세요</p>
                        </div>
                        <div class="card_imgbox">
                            <img src="./image/card_img2.png" alt="인기 상품 확인" class="card_img">
                        </div>
                    </div>
                </div>
                <div class="contents_box">
                    <div class="contents_card card3">
                        <div class="card_imgbox">
                            <img src="./image/card_img3.png" alt="인기 상품 확인" class="card_img">
                        </div>
                        <div class="card_textbox text_box3">
                            <span>Register</span>
                            <h2>판매를 원하는<br>상품을 등록하세요</h2>
                            <p>어떤 물건이든 판매하고 싶은 상품을<br>쉽게 등록하세요</p>
                        </div>
                    </div>
                </div>
            </section>
            <section class="marketing">
                <div class="marketing_container">
                    <h1 class="marketing_txt">믿을 수 있는<br>판다마켓 중고 거래</h1>
                    <div class="marketing_imgbox">
                        <img src="./image/marketing_img.png" alt="마케팅 이미지">
                    </div>
                </div>
            </section>
            <footer class="footer">
                <div class="footer_container">
                    <div class="footer_info">©codeit - 2025</div>
                    <div class="footer_menu">
                        <a href="/privacy" class="footer_menu_privacy">Privacy Policy</a>
                        <a href="/faq" class="footer_menu_faq">FAQ</a>
                    </div>
                    <div class="footer_sns">
                        <a href="https://www.facebook.com/" class="footer_facebook_ic">
                            <img src="./image/facebook_icon.png" alt="페이스북 아이콘">
                         </a>
                         <a href="https://x.com/" class="footer_twitter_ic">
                            <img src="./image/twitter_icon.png" alt="트위터 아이콘">
                         </a>
                        </a>
                        <a href="https://www.youtube.com/" class="footer_youtube_ic">
                            <img src="./image/youtube_icon.png" alt="유튜브 아이콘">
                        </a>
                        <a href="https://www.instagram.com/" class="footer_instagram_ic">
                            <img src="./image/instagram_icon.png" alt="인스타그램 아이콘">
                        </a>
                    </div>
                </div>
            </footer>        
        </div>
    </body>
</html>
