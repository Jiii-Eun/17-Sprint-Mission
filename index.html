<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>판다마켓</title>
        <link rel="stylesheet" href="/assets/styles/global.css">
        <link rel="stylesheet" href="/assets/styles/reset.css">
        <link rel="stylesheet" href="/assets/styles/style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    </head>
    <body>
        <header class="nav">
            <div class="nav-container">
              <a href="/">
                  <img src="public/images/home_logo.svg" class="logo" alt="홈으로 이동">
              </a>
              <a class="login" href="/login.html">로그인</a>
            </div>
        </header>
        <section class="trade">
            <div class="trade-container">
                <div class="trade-desc">
                    <h2 class="trade-title">일상의 모든 물건을<br>거래해 보세요</h2>
                    <a class="trade-button" href="/items">구경하러 가기</a>
                </div>
                <img src="public/images/Group 33680.png" class="trade-img" alt="쇼핑 이미지">
            </div>
        </section>
        <main class="main">
            <section class="hot-item">
                <div class="container">
                    <img src="public/images/Img_home_01.png" class="product-img" alt="인기 상품 확인 이미지">
                    <div class="container-desc">
                        <h2 class="badge">Hot item</h2>
                        <h3 class="section-title">인기 상품을<br>확인해 보세요</h3>
                        <p class="description">가장 HOT한 중고거래 물품을<br>판다 마켓에서 확인해 보세요</p>
                    </div>
                </div>
            </section>
            <section class="search">
                <div class="container">
                    <div class="container-desc">
                        <h2 class="badge">Search</h2>
                        <h3 class="section-title">구매를 원하는<br>상품을 검색하세요</h3>
                        <p class="description">구매하고 싶은 물품은 검색해서<br>쉽게 찾아보세요</p>
                    </div>
                    <img src="public/images/Img_home_02.png" class="product-img" alt="상품 검색 이미지">
                </div>
            </section>
            <section class="register">
                <div class="container">
                    <img src="public/images/Img_home_03.png" class="product-img" alt="상품 등록 이미지">
                    <div class="container-desc">
                        <h2 class="badge">Register</h2>
                        <h3 class="section-title">판매를 원하는<br>상품을 등록하세요</h3>
                        <p class="description">어떤 물건이든 판매하고 싶은 상품을<br>쉽게 등록하세요</p>
                    </div>
                </div>
            </section>
        </main>
        <section class="slogan">
            <div class="slogan-container">
                <h2>믿을 수 있는<br>판다마켓 중고 거래</h2>
                <img src="public/images/Img_home_bottom.png" class="slogan-img" alt="하단 이미지">
            </div>
        </section>
        <footer class="footer">
            <div class="footer-container">
                <p class="footer-copy">©codeit - 2024</p>
                <div class="footer-links">
                    <a class="policy" href="/privacy">Privacy Policy</a>
                    <a class="faq" href="/faq">FAQ</a>
                </div>
                <div class="footer-sns">
                    <a href="https://facebook.com" target="_blank" class="sns-icon"><i class="fab fa-facebook-f"></i></a>
                    <a href="https://twitter.com" target="_blank" class="sns-icon"><i class="fab fa-twitter"></i></a>
                    <a href="https://youtube.com" target="_blank" class="sns-icon"><i class="fab fa-youtube"></i></a>
                    <a href="https://instagram.com" target="_blank" class="sns-icon"><i class="fab fa-instagram"></i></a>
                </div>              
            </div>
        </footer>
    </body>
</html>
