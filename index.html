<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>판다마켓</title>
  <link rel="icon" href="./assets/icons/favicon.png" type="image/x-icon" />
  <link rel="stylesheet" href="./styles/main.css" />
  <link rel="stylesheet" href="./styles/common/footer.css" />
</head>
<body>
  <header class="nav">
    <div class="nav__container">
      <a href="/" class="nav__logo-link">
        <img src="./imgs/Img_og.png" alt="판다마켓 로고" class="nav__logo" />
      </a>
      <a href="/login" class="nav__login">로그인</a>
    </div>
  </header>

  <section class="hero">
    <div class="hero__container">
      <div class="hero__text">
        <h1>일상의 모든 물건을<br />거래해 보세요</h1>
        <a href="/items" class="hero__btn">구경하러 가기</a>
      </div>
      <img src="./imgs/Img_home_top.svg" alt="메인 이미지" class="hero__img" />
    </div>
  </section>

  <main>
    <section class="section">
      <div class="section__container">
        <img src="./imgs/Img_home_01.svg" alt="인기 상품" class="section__img" />
        <div class="section__text">
          <div class="badge">Hot item</div>
          <h2>인기 상품을<br />확인해 보세요</h2>
          <p>가장 HOT한 중고거래 물품을<br />판다마켓에서 확인해 보세요</p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section__container section__reverse">
        <div class="section__text">
          <div class="badge">Search</div>
          <h2>구매를 원하는<br />상품을 검색하세요</h2>
          <p>구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요</p>
        </div>
        <img src="./imgs/Img_home_02.svg" alt="검색 이미지" class="section__img" />
      </div>
    </section>

    <section class="section">
      <div class="section__container">
        <img src="./imgs/Img_home_03.svg" alt="상품 등록" class="section__img" />
        <div class="section__text">
          <div class="badge">Register</div>
          <h2>판매를 원하는<br />상품을 등록하세요</h2>
          <p>어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요</p>
        </div>
      </div>
    </section>
  </main>

  <section class="slogan">
    <div class="slogan__container">
      <h2>믿을 수 있는<br />판다마켓 중고 거래</h2>
      <img src="./imgs/Img_home_bottom.svg" alt="하단 이미지" class="slogan__img" />
    </div>
  </section>

  <footer class="footer">
    <div class="footer__container footer__row">
      <p class="footer__brand">©codeit - 2025</p>
      <div class="footer__links">
        <a href="/privacy">Privacy Policy</a>
        <a href="/faq">FAQ</a>
      </div>
      <div class="footer__sns">
        <a href="https://facebook.com" target="_blank">
          <img src="./assets/ic_facebook.svg" alt="facebook" />
        </a>
        <a href="https://twitter.com" target="_blank">
          <img src="./assets/ic_twitter.svg" alt="twitter" />
        </a>
        <a href="https://youtube.com" target="_blank">
          <img src="./assets/ic_youtube.svg" alt="youtube" />
        </a>
        <a href="https://instagram.com" target="_blank">
          <img src="./assets/ic_instagram.svg" alt="instagram" />
        </a>
      </div>
    </div>
  </footer>
</body>
</html>
