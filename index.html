<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reset-css@5.0.2/reset.min.css">
  <link rel="stylesheet" href="./main.css">
  <title>판다마켓</title> 
</head>
<body>
  <nav>
    <div class="inner">
      <div>
        <a href="/" class="logo">
          <img src="./images/pandalogo.png" alt="판다마켓">
        </a>
      </div>
      <div>
        <a href="/login" class="btn1">로그인</a>
      </div>
    </div>
  </nav>
  <header>
    <div class="container1">
      <div class="home">
        <p>일상의 모든 물건을<br>거래해 보세요</p>
        <a href="/items" class="btn2">구경하러 가기</a>
      </div>
      <div>
        <img src="./images/Img_home_top.png" alt="홈2">
      </div>
    </div>
  </header>
  <main>
    <sections class="sections">
      <div class="section">
        <div class="tablet">
          <div class="image1">
            <img src="./images/Img_home_01.png" alt="그림1">
            <div class="box1">
              <div class="word1">
                <span>Hot item</span>
                <h1>인기 상품을<br>확인해 보세요</h1>
                <p>가장 HOT한 중고거래 물품을<br>판다 마켓에서 확인해 보세요</p>              
              </div>
            </div>
          </div>
        </div>
        <div class="tablet">
          <div class="image2">
            <img src="./images/Img_home_02.png" alt="그림2">
            <div class="box2">
              <div class="word2">
                <span>Search</span>
                <h1>구매를 원하는<br>상품을 검색하요</h1>
                <p>구매하고 싶은 물품은 검색해서<br>쉽게 찾아보세요</p>
              </div>
            </div>
          </div>
        </div>        
        <div class="tablet">
          <div class="image1">
            <img src="./images/Img_home_03.png" alt="그림3">
            <div class="box3">
              <div class="word1">
                <span>Register</span>
                <h1>판매를 원하는<br>상품을 등록하세요</h1>
                <p>어떤 물건이든 판매하고 싶은 상품을<br>쉽게 등록하세요</p>              
              </div>
            </div>
          </div>
        </div>
      </div>
    </sections>
  </main>
  <bottom>
    <div class="container2">
      <div class="home">
        <p>믿을 수 있는<br>판다마켓 중고 거래</p>
      </div>
      <div>
        <img src="./images/Img_home_bottom.png" alt="홈2">
      </div>
    </div>    
  </bottom>
</body>
<footer>
  <div class="footer_box">
      <div class="codeit">
      <span>&copy;codeit-2024 </span>
    </div>
    <div class="policy">
      <a href="/privacy">Privacy Policy</a>
      <a href="/faq">FAQ</a>
    </div>
    <div class="site">
      <a href="https://www.facebook.com/" target="_blank">
        <img src="./images/facebook.png" alt="facebook">
      </a>
      <a href="https://x.com/" target="_blank">
        <img src="./images/twitter.png" alt="twitter">
      </a>
      <a href="https://www.youtube.com/" target="_blank">
        <img src="./images/youtube.png" alt="youtube">
      </a>
      <a href="https://www.instagram.com/" target="_blank">
        <img src="./images/instagram.png" alt="instagram">
      </a>
    </div>
  </div>  
</footer>  
</html>
