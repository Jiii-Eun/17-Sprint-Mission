<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <title>판다마켓</title>
    <link rel="icon" href="images/favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="./css/home/style.css">
  </head>
  <body>
    <header>
      <nav class="head-nav">
        <a href="/">
          <img src="./images/logo.png" alt="판다마켓">
        </a>
        <a class="login-btn" href="/login">
          로그인
        </a>
      </nav>
    </header>
    <main>
      <article class="home-banner">
        <p class="home-banner-text">
          <span class="banner-title">일상의 모든 물건을 거래해 보세요</span>
          <a class="items-btn" href="/items">구경하러 가기</a>
        </p>
        <div class="home-img">
          <img src="./images/Img_home_top.png" alt="배너 이미지">
        </div>
      </article>
      <section class="item-banner hot">
        <div class="item-banner-box">
          <img src="./images/Img_home_01.png" alt="인기상품 배너 이미지">
          <div class="item-banner-content">
            <span class="item-badge">
              Hot item
            </span>
            <span class="banner-title item">
              인기 상품을<br>확인해 보세요
            </span>
            <span class="item-subtitle">
              가장 HOT한 중고거래 물품을
              판다 마켓에서 확인해 보세요
            </span>
          </div>
        </div>
      </section>
      <section class="item-banner search">
        <div class="item-banner-box">
          <img src="./images/Img_home_02.png" alt="인기상품 배너 이미지">
          <div class="item-banner-content">
            <span class="item-badge">
              Search
            </span>
            <span class="banner-title item">
                구매를 원하는<br>상품을 검색하세요
            </span>
            <span class="item-subtitle">
              구매하고 싶은 물품은 검색해서 쉽게 찾아보세요
            </span>
          </div>
        </div>
      </section>
      <section class="item-banner register">
        <div class="item-banner-box">
          <img src="./images/Img_home_03.png" alt="인기상품 배너 이미지">
          <div class="item-banner-content">
            <span class="item-badge">
              Register
            </span>
            <span class="banner-title item">
              판매를 원하는<br>상품을 등록하세요
            </span>
            <span class="item-subtitle">
              어떤 물건이든 판매하고 싶은 상품을 쉽게 등록하세요
            </span>
          </div>
        </div>
      </section>
      <article class="home-banner">
        <p class="home-banner-text">
          <span class="banner-title bottom-text">믿을 수 있는<br>판다마켓 중고 거래</span>
        </p>
        <div class="home-img bottom-img">
          <img src="./images/Img_home_bottom.png" alt="배너 이미지">
        </div>
      </article>
    </main>
    <footer>
      <div class="footer-content">
        <span class="company">©codeit - 2024</span>
        <span class="policy-faq">
          <a href="/privacy">Privacy Policy</a>
          <a href="/faq">FAQ</a>
        </span>
        <span class="sns">
          <a href="https://www.facebook.com/" target="_blank">
            <img src="/images/ic_facebook.png" alt="">
          </a>
          <a href="https://x.com/" target="_blank">
            <img src="/images/ic_twitter.png" alt="">
          </a>
          <a href="https://www.youtube.com/" target="_blank">
            <img src="/images/ic_youtube.png" alt="">
          </a>
          <a href="https://www.instagram.com/" target="_blank">
            <img src="/images/ic_instagram.png" alt="">
          </a>
        </span>
      </div>
    </footer>
  </body>
</html>
