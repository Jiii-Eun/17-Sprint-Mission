<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>판다마켓</title>
  <link rel="stylesheet" href="style/style.css">
  <link rel="stylesheet" href="style/common.css">
  <link rel="stylesheet" href="style/reset.css">

</head>
<body>
  <!--헤더 부분-->
  <header class="main-header"> 
    <div class="header_logo">
    <a href="./index.html">
    <img src="images/logo1.png" alt="판다마켓 로고">
    </a>
    </div>
    <div class="login_button">
      <a href="./login/login.html">
       <button class="login">로그인</button>
      </a>
    </div>
    </header>
    <!--탑배너-->
    <section class="banner">
      <div class="banner_container">
      <h1 class = text>일상의 모든 물건을 <br> 경험해 보세요</h1>
      <a href="./items/items.html">
      <button class="watch_button">구경하러가기 </button>
        </a>
        </div>
    <div class="top_banner_img">
      <img src="images/top_banner.png" alt="일상에 모든 물건을 거래해 보세요">
    </div>
    </div> 
    </section>
    <!--섹션-->
    <section class="items">
      <div class="item">
      <img class="items_img" src="images/item_hot.png" alt="인기상품을 확인해 보세요">
      <div class="item_container">
      <h6 class="items_title">Hot item</h6>
      <h1 class="items_info">인기 상품을 <br>확인해 보세요</h1>
      <h3 class="items_text">가장 HOT한 중고거래 물품을 <br>판다마켓에서 확인해 보세요</h3>
      </div>
    </div> 
       
       <!--섹션1-->
   <div class ="item">
    <div class="item_container_left">
    <img class="items_img" src="images/item_search.png" alt="구매를 원하는 상품을 검색하세요">
    <div class="item_container">
    <h6 class="items_title">Search</h6>
    <h1 class="items_info">구매를 원하는<br>상품을 검색하세요</h1>
    <h3 class="items_text">구매하고 싶은 물품은 검색해서<br>쉽게 찾아보세요</h3>
    </div>
  </div>
  </div>
   <!--섹션2-->
   <div class="item">
    <img class="items_img" src="images/item_register.png" alt="판매를 원하는 상품을 등록하세요">
    <div class="item_container">
    <h6 class="items_title">Register</h6>
    <h1 class="items_info">판매를 원하는<br>상품을 등록하세요</h1>
    <h3 class="items_text">어떤 물건이든 판매하고 싶은 상품을<br>쉽게 등록하세요</h3>
    </div>
  </div>

  </section> 
   <!--바텀배너-->
   <div class="bottom_banner">
    <div class="bottom_container">
    <img  src="images/btbanner.png" alt="믿을 수 있는 판다마켓">
    <h1 class="text">믿을 수 있는 <br>판다마켓 중고 거래</h1>
  </div>
</div>
  
  <!--푸터 부분-->
  <footer class="footer">
    <div class="footer_left" style=>&copy;codeit * 2024</div>
    <div class="footer_middle">
      <a class="footer_middle_text" href="./privacy/privacy.html">
        Privacy Poilcy
      </a>
      <a class="footer_middle_text" href="./faq/faq.html">
        FAQ
      </a>
    </div>
    <div class="sns" >
      <a href="https://facebook.com" target="_blank" alt="페이스북">
      <img class="sns_img" src="images/ic_facebook.png">
    </a>
    <a href="https://twitter.com" target="_blank" alt="트위터">
    <img class="sns_img" src="images/ic_twitter.png" alt="트위터">
    </a>
    <a href="https://youtube.com" target="_blank" alt="유트브">   
    <img class="sns_img" src="images/ic_youtube.png" alt="트위터">
    </a>
    <a href="https://instagram.com" target="_blank" alt="인스타">
    <img class="sns_img" src="images/ic_instagram.png" alt="인스타">
    </a>
    </div>
