<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/pages/home.css" />
    <title>판다마켓</title>
    <link rel="icon" href="./assets/icons/favicon.png" type="image/x-icon" />
    <!-- Primary Meta Tags -->
    <title>판다마켓</title>
    <meta name="title" content="판다마켓" />
    <meta name="description" content="일상의 모든 물건을 거래해보세요" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta
      property="og:url"
      content="https://awkward-panda-market.netlify.app/"
    />
    <meta property="og:title" content="판다마켓" />
    <meta property="og:description" content="일상의 모든 물건을 거래해보세요" />
    <meta property="og:image" content="https://i.imgur.com/ORYlHQw.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:url"
      content="https://awkward-panda-market.netlify.app/"
    />
    <meta property="twitter:image" content="https://i.imgur.com/ORYlHQw.png" />
    <meta property="twitter:title" content="판다마켓" />
    <meta
      property="twitter:description"
      content="일상의 모든 물건을 거래해보세요"
    />
  </head>
  <body>
    <header class="header">
      <nav class="navbar">
        <div class="navbar__logo-wrapper">
          <img
            class="navbar__logo"
            src="./assets/imgs/panda_icon_small.svg"
            alt="판다마켓 로고"
          />
          <h1 class="navbar__title">
            <a href="/" aria-label="홈으로 이동">판다마켓</a>
          </h1>
        </div>
        <a
          class="navbar__login-btn"
          href="./login.html"
          aria-label="로그인 화면으로 이동"
          >로그인</a
        >
      </nav>
    </header>
    <section class="section-blue">
      <div class="section-blue__container">
        <h1 class="section-blue__title">
          일상의 모든 물건을<br />
          거래해 보세요
        </h1>
        <a
          class="section-blue__btn"
          href="./items.html"
          aria-label="거래 화면으로 이동"
          >구경하러 가기</a
        >
      </div>
      <img
        class="section-blue__img"
        src="./assets/imgs/Img_home_top.svg"
        alt="판다가 인사하는 그림"
      />
    </section>
    <section class="section-main">
      <div class="section-main__wrapper">
        <img
          class="section-main__img"
          src="./assets/imgs/Img_home_01.svg"
          alt="판다가 쇼핑하는 그림"
        />
        <div class="section-main__container">
          <div class="section-main__hot-badge">Hot item</div>
          <h2 class="section-main__title">인기 상품을<br />확인해 보세요</h2>
          <div class="section-main-description">
            가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요
          </div>
        </div>
      </div>
    </section>
    <section class="section-main">
      <div class="section-main__wrapper section-main__wrapper__reverse">
        <div class="section-main__container">
          <div class="section-main__hot-badge">Search</div>
          <h2 class="section-main__title">
            구매를 원하는<br />상품을 검색하세요
          </h2>
          <div class="section-main-description">
            구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요
          </div>
        </div>
        <img
          class="section-main__img"
          src="./assets/imgs/Img_home_02.svg"
          alt="상품을 돋보기로 찾는 그림"
        />
      </div>
    </section>
    <section class="section-main">
      <div class="section-main__wrapper">
        <img
          class="section-main__img"
          src="./assets/imgs/Img_home_03.svg"
          alt="컴퓨터 폴더에서 상품 이미지를 등록하는 그림"
        />
        <div class="section-main__container">
          <div class="section-main__hot-badge">Register</div>
          <h2 class="section-main__title">
            판매를 원하는<br />상품을 등록하세요
          </h2>
          <div class="section-main-description">
            어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요
          </div>
        </div>
      </div>
    </section>
    <section class="section-blue">
      <div class="section-blue__container__bottom">
        <h1 class="section-blue__title">
          믿을 수 있는<br />
          판다마켓 중고 거래
        </h1>
      </div>
      <img
        class="section-blue__img"
        src="./assets/imgs/Img_home_bottom.svg"
        alt="두 판다가 서로 인사하는 그림"
      />
    </section>
    <footer class="footer">
      <div class="footer__container">
        <span class="footer__copyright">©codeit - 2024</span>
        <div class="footer__info">
          <a href="privacy.html" aria-label="개인정보 관리 정책 화면으로 이동"
            >Privacy Policy</a
          >
          <a href="faq.html" aria-label="FAQ 화면으로 이동">FAQ</a>
        </div>
        <div class="footer__sns-icons">
          <a
            href="https://www.facebook.com"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="페이스북 페이지로 이동"
            ><img
              class="footer__sns-icon"
              src="./assets/icons/ic_facebook.svg"
              alt="페이스북 아이콘"
          /></a>
          <a
            href="https://www.x.com"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="트위터 페이지로 이동"
            ><img
              class="footer__sns-icon"
              src="./assets/icons/ic_twitter.svg"
              alt="트위터 아이콘"
          /></a>
          <a
            href="https://www.youtube.com"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="유튜브 페이지로 이동"
            ><img
              class="footer__sns-icon"
              src="./assets/icons/ic_youtube.svg"
              alt="유튜브 아이콘"
          /></a>
          <a
            href="https://www.instagram.com"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="인스타그램 페이지로 이동"
            ><img
              class="footer__sns-icon"
              src="./assets/icons/ic_instagram.svg"
              alt="인스타그램 아이콘"
          /></a>
        </div>
      </div>
    </footer>
  </body>
</html>
