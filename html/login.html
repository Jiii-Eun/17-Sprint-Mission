<!DOCTYPE html>
<html lang="kr">
<head>
    <meta charset="UTF-8" />
    <title>로그인</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="/17-Sprint-Mission/style/style.css">
</head>
<body>
    <div class="login-box">
        <div class="login-container">
            <a href="/17-Sprint-Mission/html/main.html">
                <img class="login-logo" src="/17-Sprint-Mission/assets/logo/Property 1=lg.png" alt="logo">
            </a>
            <div class="login-input">
                <p class="login-text" for="email">이메일</p>
                <div>
                    <input type="text" id="email" name="email" required>
                </div>
                <div class="password-wrapper">
                    <p class="login-text" for="password">비밀번호</p>
                    <div class="password-input">
                        <input type="password" id="password" name="password" required>
                        <img class="password-icon" src="/17-Sprint-Mission/assets/icon/Property 1=Variant2.png" alt="Variant">
                    </div>
                </div>
            </div>
            <button type="submit">로그인</button>
            <div class="easy-login">
                <p>간편 로그인하기</p>
                <div class="easy-login-icon">
                    <a href="https://www.google.com/" target="_blank">
                        <img src="/17-Sprint-Mission/assets/icon/Component 2.png" alt="google">
                    </a>
                    <a href="https://www.kakaocorp.com/page/" target="_blank">
                        <img src="/17-Sprint-Mission/assets/icon/Component 3.png" alt="kakao">
                    </a>
                </div>
            </div>
            <div class="first-visit">
                <p>
                    판다마켓이 처음이신가요? 
                    <a class="sign-in" href="/17-Sprint-Mission/html/signup.html">회원가입</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
