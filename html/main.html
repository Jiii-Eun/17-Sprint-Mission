<!DOCTYPE html>

        </div>
        <div class="section">
            <img src="/17-Sprint-Mission/assets/img/Img_home_03.png" alt="Register">
            <div class="text">
                <h1>Register</h1>
                <p class="content-large">판매를 원하는<br>상품을 등록하세요</p>

        <div class="container1">

                    <p>믿을 수 있는<br>
